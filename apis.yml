name: Sonar Mental Health
description: Sonar Mental Health provides 24/7 text-based wellbeing coaching and care
  navigation for youth. Trained Wellbeing Coaches lead the conversations, supported
  by AI tooling that surfaces context and flags risk without making independent decisions,
  delivering between-visit and after-hours support, escalation and care coordination
  to higher levels of care, and real-time insights dashboards for measurement-based
  care across schools, health systems, primary care, and EAP pathways. The company
  reports serving 20,000+ young people with higher engagement between visits, and is
  backed by 500 Global. There is no public developer API surface; this profile captures
  the company's identity, security posture (SOC 2, HIPAA), and public web properties.
